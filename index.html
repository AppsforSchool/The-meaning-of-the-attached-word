<html lang="ja">
  
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>助動詞･助詞の意味</title>
  <meta name="apple-mobile-web-app-capable" content="yes"> 
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Signika+Negative:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
  
<body>
  <header id="app-header">
    <div id="title-area">
      <p id="header-title">助動詞･助詞の意味</p>
    </div>
    <button id="share-modal-btn">シェア</button>
  </header>
  
  <div id="share-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <p class="title">シェア</p>
        <span id="share-modal-close" class="close-button">&times;</span>
      </div>
      <img src="qrcode.png" alt="QR Code">
    </div>
  </div>
  
  
  
  <main>
    <div id="selection-container">
      <p id="selection-title">出題設定</p>
 
      <div class="selection">
        <div class="title-area">
          <p class="title">出題形式</p>
        </div>
        <div class="segmented-buttons">
          <button class="type-button active" data-type="card">カード形式</button>
          <!-- <button class="type-button" data-type="output">一覧で出力する</button> -->
        </div>
      </div>
      
      <span class="split-line"></span>
      
      <div class="selection">
        <div class="title-area">
          <p class="title">出題内容</p>
        </div>
        <div class="segmented-buttons">
          <button class="qtype-button active" data-question="auxiliaryVerb" data-answer="meaning">助動詞 → 意味</button>
          <button class="qtype-button" data-question="meaning" data-answer="auxiliaryVerb">意味 → 助動詞</button>
          <button class="qtype-button" data-question="particle" data-answer="meaning">助詞 → 意味</button>
          <button class="qtype-button" data-question="meaning" data-answer="particle">意味 → 助詞</button>
        </div>
      </div>
      
      <div class="selection">
        <div class="title-area">
          <p class="title">出題数</p>
        </div>
        <div class="segmented-buttons">
          <button class="count-button active" data-count="5">5問</button>
          <button class="count-button" data-count="10">10問</button>
          <button class="count-button" data-count="all">全ての問題</button>
        </div>
      </div>
      
      <span class="split-line"></span>
      <button id="start-button">スタート！</button>
      <p id="start-message"></p>
     
    </div>
  </main>
  
  <footer>
    <p>QRコードは株式会社デンソーウェーブの登録商標です。</p>
  </footer>
  
  <script type="module" src="script.js"></script>
</html>
